name: latest Platform Mesh version
description: Resolves the latest published github.com/platform-mesh/platform-mesh component version.
inputs:
  ocm-repo:
    description: OCM repository to look in
    required: false
    default: ghcr.io/${{ github.repository_owner }}
outputs:
  version:
    description: The resolved version
    value: ${{ steps.resolve.outputs.version }}
runs:
  using: composite
  steps:
    - name: Resolve latest published Platform Mesh version
      id: resolve
      shell: bash
      env:
        OCM_REPO: ${{ inputs.ocm-repo }}
      run: |
        set -euo pipefail
        ocm="$(UGET_PRINT_PATH=absolute task tools:ocm)"
        version="$("$ocm" get component-version --latest "$OCM_REPO//github.com/platform-mesh/platform-mesh" -o json | jq -r '.[0].component.version')"
        [ -n "$version" ] && [ "$version" != null ] || { echo "::error::no published Platform Mesh version found in $OCM_REPO"; exit 1; }
        echo "Latest published Platform Mesh version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
