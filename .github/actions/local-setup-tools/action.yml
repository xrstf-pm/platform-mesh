name: local-setup tools
description: Installs the tools local-setup needs on a runner (gh, task, kubectl kcp plugins, ocm, helm).
inputs:
  repo-token:
    description: GitHub token for tool downloads
    required: true
runs:
  using: composite
  steps:
    - uses: ksivamuthu/actions-setup-gh-cli@c78dbed4be2f8d6133a14a9a597ee12fd4ed5c93 # v3
      with:
        version: 2.24.3
    - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        version: 3.44.1
        repo-token: ${{ inputs.repo-token }}
    - name: Install kubectl kcp plugins
      shell: bash
      run: |
        set -euo pipefail
        ( cd "$(mktemp -d)" && curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/krew-linux_amd64.tar.gz" && tar zxf krew-linux_amd64.tar.gz && KREW_ROOT="$HOME/.krew" ./krew-linux_amd64 install krew )
        echo "$HOME/.krew/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.krew/bin:$PATH"
        kubectl krew index add kcp-dev https://github.com/kcp-dev/krew-index.git
        kubectl krew install kcp-dev/kcp kcp-dev/ws kcp-dev/create-workspace oidc-login
    - name: Install ocm (pinned in tools/Taskfile.yaml)
      shell: bash
      run: echo "OCM=$(UGET_PRINT_PATH=absolute task tools:ocm)" >> "$GITHUB_ENV"
