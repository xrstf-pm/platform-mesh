name: verify

# These are the global verification jobs that run regardless of what was changed
# in a Pull Request.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Repo-wide checks, no path filter. Per-component lint/tidy/boilerplate run
  # in `verify` below for the changed components; this catches everything
  # outside a component (hack/, tools/, ...) and the commits themselves.
  # ──────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    env:
      # `task dco` walks BASE..HEAD: on a pull request the PR's own commits,
      # in the merge queue the commits being merged.
      BASE: origin/${{ github.base_ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # `task dco` needs the base branch and full commit history

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: true

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Every commit on the branch needs a Signed-off-by matching its author.
      # The DCO app gates pull requests but not the merge queue, and running it
      # here means `task verify` locally catches the same thing before pushing.
      - name: DCO sign-off on every commit
        run: task dco BASE="${BASE}"
        if: ${{ !startsWith(github.event.pull_request.title, '[REBASE] ') }}

      # Missing headers are fixed locally with `task boilerplate-fix`.
      - name: License headers
        run: task boilerplate

      - name: Verify Go versions in go.mod files
        run: hack/verify-go-version.sh
