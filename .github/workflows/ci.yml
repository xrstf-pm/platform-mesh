name: ci

# Per-change checks for the whole monorepo. Replaces the former one-workflow-
# per-component setup; the component list comes from ocm/components.yaml.
#
#   Pull requests / merge queue:
#     - for every component whose sources changed (a change to a shared
#       library or go.work counts for all): verify, unit tests, e2e tests,
#       image build (not pushed)
#     - for every changed chart: ct lint (includes the version bump check),
#       helm unittest, generated docs up to date
#   Push to main:
#     - no verification (the commit passed these checks as a pull request and
#       in the merge queue); only the mutable :latest image of every changed
#       component is built, pushed and signed
#
# Releases are not handled here: see component-release.yml (`<component>/v*`
# tags) and release.yml (`v*` tags).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Work out what changed.
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.c.outputs.components }}
      e2eComponents: ${{ steps.c.outputs.e2eComponents }}
      imageComponents: ${{ steps.c.outputs.imageComponents }}
      charts: ${{ steps.c.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed components and charts
        id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE...HEAD")"
          else
            changed=""   # unknown base (e.g. force push): everything
          fi
          hack/release/changed-components.sh "$changed" | tee -a "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Go components.
  # ──────────────────────────────────────────────
  verify:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify (lint, tidy, boilerplate)
        run: task verify-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  test:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit tests
        run: task test-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  test-e2e:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.e2eComponents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.e2eComponents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: E2E tests
        run: task test-e2e-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  # PR: build only, after the checks passed. main: push and sign :latest
  # (no checks; the commit was verified before merging).
  image:
    needs: [changes, verify, test]
    if: |
      always() && needs.changes.outputs.imageComponents != '[]'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # :latest on main
      id-token: write # cosign
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.imageComponents) }}
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@5964de0df58d5ad28b04d8fe2e6b80ad47105b91 # v3.5.0
        if: env.PUSH == 'true'
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (push + :latest on main only)
        id: build
        env:
          COMPONENT: ${{ matrix.component }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ]; then
            version=latest; platforms=linux/amd64,linux/arm64
          else
            version=pr-${PR:-0}; platforms=linux/amd64
          fi
          task images-${COMPONENT} \
            VERSION=$version \
            REPO=${GITHUB_REPOSITORY_OWNER}/platform-mesh \
            PLATFORMS=$platforms \
            PUSH=$PUSH \
            METADATA_FILE="${RUNNER_TEMP}/metadata.json"
          if [ "$PUSH" = "true" ]; then
            image=$(yq ".components.\"$COMPONENT\".image" ocm/components.yaml)
            digest=$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")
            echo "imageRef=ghcr.io/${GITHUB_REPOSITORY_OWNER}/platform-mesh/${image}@${digest}" >> "$GITHUB_OUTPUT"
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
      - name: Sign image
        if: env.PUSH == 'true'
        run: cosign sign --yes "${IMAGE_REF}"
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageRef }}

  # ──────────────────────────────────────────────
  # Charts.
  # ──────────────────────────────────────────────
  chart-lint:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce common image schema (air-gap localization)
        run: ./hack/charts/lint-image-schema.sh
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: 'v3.14.0'
          yamllint_version: '1.37.0'
          yamale_version: '5.2.1'
      - name: Log in to ghcr.io (chart dependencies)
        run: echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ct lint also fails if a changed chart's version was not bumped.
      - name: Lint charts (ct lint, includes version bump check)
        run: |
          ct lint --target-branch "${DEFAULT_BRANCH}" --chart-dirs=charts --validate-maintainers=false \
            --chart-repos=bitnami=https://charts.bitnami.com/bitnami,openfga=https://openfga.github.io/helm-charts,prometheus-community=https://prometheus-community.github.io/helm-charts,open-telemetry=https://open-telemetry.github.io/opentelemetry-helm-charts
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  chart-unittest:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.changes.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest
      - name: Chart unit tests
        run: helm unittest "charts/${CHART}"
        env:
          CHART: ${{ matrix.chart }}

  # The keycloak-operator chart vendors the operator's CRDs; they must match
  # the operator version in values.yaml.
  chart-keycloak-crds:
    needs: changes
    if: github.event_name != 'push' && contains(fromJson(needs.changes.outputs.charts), 'keycloak-operator')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Keycloak CRDs match the operator version
        run: |
          set -euo pipefail
          bash hack/charts/update-keycloak-crds.sh "$(yq '.image.tag' charts/keycloak-operator/values.yaml)"
          git diff --exit-code charts/keycloak-operator/crds/

  chart-docs:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate chart docs
        run: task charts:docs
      - name: Generated chart docs must be committed
        run: git diff --exit-code
