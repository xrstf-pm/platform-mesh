name: ci

# Per-change checks for the whole monorepo. Replaces the former one-workflow-
# per-component setup; the component list comes from ocm/components.yaml.
#
# Runs for pull requests and in the merge queue:
#   - for every component whose sources changed (a change to a shared library
#     or go.work counts for all): verify, unit tests, e2e tests, image build
#     (not pushed)
#   - for every changed chart: ct lint (includes the version bump check), helm
#     unittest, generated docs up to date
#
# Nothing is verified on pushes to main: every commit there went through these
# checks already. The other workflows: images.yml (:latest images on push to
# main), component-release.yml (`<component>/v*` tags), release.yml (`v*`
# tags), prerelease.yml (manual builds of main).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Work out what changed.
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.c.outputs.components }}
      e2eComponents: ${{ steps.c.outputs.e2eComponents }}
      imageComponents: ${{ steps.c.outputs.imageComponents }}
      charts: ${{ steps.c.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed components and charts
        id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          hack/release/changed-components.sh "$(git diff --name-only "$BASE...HEAD")" | tee -a "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Go components.
  # ──────────────────────────────────────────────
  verify:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify (lint, tidy, boilerplate)
        run: task verify-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  test:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit tests
        run: task test-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  test-e2e:
    needs: changes
    if: needs.changes.outputs.e2eComponents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.e2eComponents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: E2E tests
        run: task test-e2e-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  # The image must build, but is not pushed anywhere.
  image:
    needs: [changes, verify, test]
    if: needs.changes.outputs.imageComponents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.imageComponents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        env:
          COMPONENT: ${{ matrix.component }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          task images-${COMPONENT} \
            VERSION=pr-${PR:-0} \
            REPO=${GITHUB_REPOSITORY_OWNER}/platform-mesh \
            PLATFORMS=linux/amd64 \
            PUSH=false

  # ──────────────────────────────────────────────
  # Charts.
  # ──────────────────────────────────────────────
  chart-lint:
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Install yamllint and yamale (used by ct lint)
        run: pip install --quiet yamllint==1.37.0 yamale==5.2.1
      - name: Log in to ghcr.io (chart dependencies)
        run: task tools:helm && echo "${GITHUB_TOKEN}" | bin/helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Image schema check + ct lint; the latter also fails if a changed
      # chart's version was not bumped.
      - name: Lint charts
        run: task charts:lint TARGET_BRANCH="${DEFAULT_BRANCH}"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  chart-unittest:
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.changes.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Chart unit tests
        run: task charts:helmtest CHARTS="charts/${CHART}"
        env:
          CHART: ${{ matrix.chart }}

  # The keycloak-operator chart vendors the operator's CRDs; they must match
  # the operator version in values.yaml.
  chart-keycloak-crds:
    needs: changes
    if: contains(fromJson(needs.changes.outputs.charts), 'keycloak-operator')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Keycloak CRDs match the operator version
        run: |
          set -euo pipefail
          bash hack/charts/update-keycloak-crds.sh "$(yq '.image.tag' charts/keycloak-operator/values.yaml)"
          git diff --exit-code charts/keycloak-operator/crds/

  chart-docs:
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate chart docs
        run: task charts:docs
      - name: Generated chart docs must be committed
        run: git diff --exit-code
