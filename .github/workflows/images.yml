name: images

# Keeps the mutable :latest images current: on every push to main, the image
# of every component whose sources changed in that push is built for
# amd64/arm64, pushed as ghcr.io/<owner>/platform-mesh/<component>:latest and
# signed. (A change to a shared library, go.work or ocm/components.yaml counts
# for all components.)
#
# No checks run here; the commit passed them as a pull request and in the
# merge queue (ci.yml). Versioned, immutable images are built by
# component-release.yml for `<component>/v*` tags.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Rebuild :latest for every component, not just the changed ones"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      imageComponents: ${{ steps.c.outputs.imageComponents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed components
        id: c
        env:
          BASE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail
          if [ "$ALL" = "true" ] || ! git cat-file -e "${BASE:-none}" 2>/dev/null; then
            changed=""   # everything (manual request, or unknown base such as a force push)
          else
            changed="$(git diff --name-only "$BASE..HEAD")"
          fi
          hack/release/changed-components.sh "$changed" | tee -a "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.imageComponents != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push :latest
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.imageComponents) }}
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@5964de0df58d5ad28b04d8fe2e6b80ad47105b91 # v3.5.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push :latest
        id: build
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          task images-${COMPONENT} \
            VERSION=latest \
            REPO=${GITHUB_REPOSITORY_OWNER}/platform-mesh \
            PLATFORMS=linux/amd64,linux/arm64 \
            PUSH=true \
            METADATA_FILE="${RUNNER_TEMP}/metadata.json"
          image=$(yq ".components.\"$COMPONENT\".image" ocm/components.yaml)
          digest=$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")
          echo "imageRef=ghcr.io/${GITHUB_REPOSITORY_OWNER}/platform-mesh/${image}@${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        run: cosign sign --yes "${IMAGE_REF}"
        env:
          IMAGE_REF: ${{ steps.build.outputs.imageRef }}
