name: release

# Releases Platform Mesh. Triggered by pushing a tag `vX.Y.Z` (final) or
# `vX.Y.Z-rc.N` (release candidate). The tagged commit defines the release:
#
#   charts/*/Chart.yaml      which chart versions ship, and through their
#                            appVersion which component images
#   ocm/versions.yaml        which third-party versions
#
# hack/release/build-aggregate.sh turns that into the OCM component graph:
# charts not yet in the registry are packaged and pushed, their OCM components
# and the third-party wrapper components are created, and the aggregate
# github.com/platform-mesh/platform-mesh:<X.Y.Z> is published and signed.
# Component images are NOT built here; they must have been released before
# via their `<component>/vX.Y.Z` tags (component-release.yml). The build fails
# with a list of missing ones otherwise.
#
# Finally a GitHub release is created with generated notes.
#
# Prerelease builds from main use prerelease.yml, which runs the same script.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      packages: write # push charts and OCM components
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      OCM_REPO: ghcr.io/${{ github.repository_owner }}
      # The signature name must equal the CN of the signing certificate.
      SIGNATURE: ${{ vars.OCM_SIGNATURE_NAME || 'platform-mesh.platform-mesh' }}
      # Test setups only: copy referenced image components that were built
      # elsewhere from this OCM repository. Unset in the platform-mesh org.
      MIRROR_FROM: ${{ vars.OCM_MIRROR_FROM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # release notes compare against the previous tag

      - name: Resolve version
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing Platform Mesh $version (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ocm, helm, yq (pinned in tools/Taskfile.yaml)
        run: |
          echo "OCM=$(UGET_PRINT_PATH=absolute task tools:ocm)" >> "$GITHUB_ENV"
          echo "HELM=$(UGET_PRINT_PATH=absolute task tools:helm)" >> "$GITHUB_ENV"
          echo "YQ=$(UGET_PRINT_PATH=absolute task tools:yq)" >> "$GITHUB_ENV"
          pip3 install --quiet pyyaml

      - name: Registry credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
          OCM_SIGNING_CERT: ${{ secrets.OCM_SIGNING_CERT }}
        run: |
          set -euo pipefail
          if [ -z "$OCM_SIGNING_PRIVATE_KEY" ] || [ -z "$OCM_SIGNING_CERT" ]; then
            echo "::error::OCM_SIGNING_PRIVATE_KEY / OCM_SIGNING_CERT secrets are not set"; exit 1
          fi
          echo "$GITHUB_TOKEN" | "$HELM" registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          hack/release/ocm-config.sh "$OCM_REPO" "$SIGNATURE" > "$HOME/.ocmconfig"

      - name: Build and publish OCM components
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --ocm-repo "$OCM_REPO" --signature "$SIGNATURE"
                --repo-url "$REPO_URL" --commit "$GITHUB_SHA")
          [ -n "$MIRROR_FROM" ] && args+=(--mirror-from "$MIRROR_FROM")
          hack/release/build-aggregate.sh "${args[@]}"
          {
            echo "### Published to \`$OCM_REPO\`"
            echo '```'
            cat ocm/.generated/published.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published
          path: ocm/.generated/published.txt
          retention-days: 7

      - name: Release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hack/release/release-notes.sh "v${VERSION}" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "Platform Mesh ${TAG#v}" --notes-file release-notes.md --verify-tag)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          cp ocm/.generated/constructor.yaml component-constructor.yaml
          gh release create "$TAG" "${flags[@]}" component-constructor.yaml

  # ──────────────────────────────────────────────
  # Check the published result the way a consumer would see it.
  # ──────────────────────────────────────────────
  verify:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      OCM_REPO: ghcr.io/${{ github.repository_owner }}
      COMPONENT: github.com/platform-mesh/platform-mesh
      SIGNATURE: ${{ vars.OCM_SIGNATURE_NAME || 'platform-mesh.platform-mesh' }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ocm, helm, yq (pinned in tools/Taskfile.yaml)
        run: |
          echo "OCM=$(UGET_PRINT_PATH=absolute task tools:ocm)" >> "$GITHUB_ENV"
          echo "HELM=$(UGET_PRINT_PATH=absolute task tools:helm)" >> "$GITHUB_ENV"
          echo "YQ=$(UGET_PRINT_PATH=absolute task tools:yq)" >> "$GITHUB_ENV"
      - name: Registry credentials (public key only, no signing key)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCM_SIGNING_CERT: ${{ secrets.OCM_SIGNING_CERT }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | "$HELM" registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          OCM_SIGNING_PRIVATE_KEY=unused hack/release/ocm-config.sh "$OCM_REPO" "$SIGNATURE" \
            | "$YQ" 'del(.configurations[].consumers[].credentials[].properties.private_key_pem)' > "$HOME/.ocmconfig"
      - name: Component graph
        run: |
          set -euo pipefail
          "$OCM" get component-version "$OCM_REPO//$COMPONENT:$VERSION" --recursive -o yaml > graph.yaml
          {
            echo "### Component graph of \`$COMPONENT:$VERSION\`"
            echo '```'
            "$OCM" get component-version "$OCM_REPO//$COMPONENT:$VERSION" --recursive
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: published
      - name: Signatures
        run: |
          set -euo pipefail
          # The aggregate and every component version this run published must
          # verify with our certificate. Components published earlier (or
          # mirrored from elsewhere) may carry signatures from other keys.
          { echo "$COMPONENT:$VERSION"; cat published.txt; } | sort -u | while read -r cv; do
            [ -n "$cv" ] || continue
            "$OCM" verify component-version --signature "$SIGNATURE" "$OCM_REPO//$cv" >/dev/null
            echo "verified $cv"
          done
      - name: Charts are installable
        run: |
          set -euo pipefail
          for chart in account-operator infra common; do
            v="$("$YQ" '.version' "charts/$chart/Chart.yaml")"
            "$HELM" pull "oci://$OCM_REPO/platform-mesh/$chart" --version "$v" --destination /tmp
            [ "$chart" = common ] || "$HELM" template "/tmp/$chart-$v.tgz" >/dev/null
            echo "ok: $chart $v"
          done
