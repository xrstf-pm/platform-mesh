name: verify-charts

# This workflow runs if any of the charts were touched and ensures that the
# generated documentation still matches the values.yaml files.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'charts/**'
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-charts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chart-docs:
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate chart docs
        run: task charts:docs

      - name: Generated chart docs must be committed
        run: git diff --exit-code
