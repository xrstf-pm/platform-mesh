name: e2e-localsetup

# Installs Platform Mesh into kind with local-setup and runs the portal e2e
# tests. Replaces the former kind-localsetup, kind-localsetup-remote and
# nightly-local-setup workflows (three copies of the same steps).
#
#   local   builds the OCM aggregate from the charts in the working tree
#           (images as pinned by the charts' appVersion) and installs it.
#           Runs on pull requests touching charts or local-setup, and nightly.
#   remote  two-cluster setup (ArgoCD) installing the latest PUBLISHED
#           aggregate. Nightly only; it cannot build from source.

on:
  pull_request:
    branches: [main]
    paths:
      - 'charts/**'
      - 'local-setup/**'
      - 'ocm/**'
      - 'hack/release/**'
      - '.github/workflows/e2e-localsetup.yml'
      - '!**/*.md'
      - '!**/README.md.gotmpl'
  merge_group:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      remote:
        description: "Also run the remote (two-cluster, ArgoCD) variant"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: e2e-localsetup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local:
    runs-on: ubuntu-latest-large
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/local-setup-tools
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache third-party OCM components
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ocm/cache/
          key: ocm-thirdparty-${{ hashFiles('ocm/versions.yaml') }}
      - name: Run local-setup with sharded example data
        run: task local-setup:start -- --concurrent --example-data
      - name: Wait for all components to be ready
        if: github.event_name == 'schedule'
        run: |
          sleep 10
          kubectl wait --for=condition=ready --timeout=10m component --all -A
          kubectl wait --for=condition=ready --timeout=10m resource --all -A
          kubectl wait --for=condition=ready --timeout=10m hr --all -A
          kubectl wait --for=condition=Available --timeout=10m deployment --all -A
      - uses: ./.github/actions/playwright
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run e2e tests
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task local-setup:test:portal-e2e:video
      - uses: ./.github/actions/local-setup-diagnostics
        if: failure()
        with:
          name: local

  remote:
    if: github.event_name == 'schedule' || inputs.remote
    runs-on: ubuntu-latest-large
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/local-setup-tools
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v3.2.3/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
      - name: Latest published Platform Mesh version
        id: pm-version
        env:
          OCM_REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="$(ocm get component-version --latest "$OCM_REPO//github.com/platform-mesh/platform-mesh" -o json | jq -r '.[0].component.version')"
          [ -n "$version" ] && [ "$version" != null ] || { echo "::error::no published Platform Mesh version found in $OCM_REPO"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate webhook certificates
        run: local-setup/scripts/gen-certs.sh
      - name: Run remote local-setup (ArgoCD + example-data)
        env:
          PLATFORM_MESH_VERSION: ${{ steps.pm-version.outputs.version }}
          DEBUG: true
        run: task local-setup:start -- --remote --deployment-tech=argocd --example-data
      - uses: ./.github/actions/playwright
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run e2e tests
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task local-setup:test:portal-e2e:remote
      - uses: ./.github/actions/local-setup-diagnostics
        if: failure()
        with:
          name: remote
