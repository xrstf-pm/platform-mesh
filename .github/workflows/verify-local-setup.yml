name: verify-local-setup

# Builds the OCM aggregate from the charts in the working tree (images as
# pinned by the charts' appVersion), installs it into kind with local-setup
# and runs the portal e2e tests. The steps live in .github/actions/local-setup,
# shared with local-setup-nightly.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'charts/**'
      - 'local-setup/**'
      - 'ocm/**'
      - 'hack/release/**'
      - '.github/actions/local-setup/**'
      - '.github/actions/local-setup-*/**'
      - '.github/actions/playwright/**'
      - '.github/workflows/verify-local-setup.yml'
      - '!**/*.md'
      - '!**/README.md.gotmpl'
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-local-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest-large
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/local-setup
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
