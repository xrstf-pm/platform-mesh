name: verify-local-setup-remote

# Installs the latest PUBLISHED Platform Mesh version with local-setup in
# remote mode (two kind clusters, using ArgoCD) and runs the portal e2e tests.
#
# Remote mode cannot build from source, so this does not test the pull
# request's charts; it tests the parts of the remote deployment that are
# applied from the checkout (the overlays and components listed below) against
# the latest release. The steps live in .github/actions/local-setup-remote,
# shared with local-setup-nightly.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'local-setup/kustomize/overlays/example-data-remote/**'
      - 'local-setup/kustomize/overlays/platform-mesh-resource-argocd/**'
      - 'local-setup/kustomize/components/platform-mesh-operator-fluxcd/**'
      - '.github/actions/local-setup-remote/**'
      - '.github/workflows/verify-local-setup-remote.yml'
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-local-setup-remote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest-large
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/local-setup-remote
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          platform-mesh-version: latest
