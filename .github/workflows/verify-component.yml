name: verify-component

# This file contains the per-component verification jobs that run for each
# Pull Request and prevent it from being merged unless they pass.
# The workflow first determines the changed components (as per
# ocm/components.yaml) and then runs the individual verifications as a matrix
# for each component.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: verify-component-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Work out what changed.
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.c.outputs.components }}
      e2eComponents: ${{ steps.c.outputs.e2eComponents }}
      imageComponents: ${{ steps.c.outputs.imageComponents }}
      charts: ${{ steps.c.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed components and charts
        id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          hack/release/changed-components.sh "$(git diff --name-only "$BASE...HEAD")" | tee -a "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Go components.
  # ──────────────────────────────────────────────
  verify:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify (lint, tidy, boilerplate)
        run: task verify-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  test:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit tests
        run: task test-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  # Envtest suites against a shared kcp, or (platform-mesh-operator) a kind
  # cluster with the whole stack; see each component's `test-e2e` task.
  test-e2e:
    needs: changes
    if: needs.changes.outputs.e2eComponents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.e2eComponents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Local hostnames used by the kind-based suites
        run: |
          echo "127.0.0.1 portal.localhost" | sudo tee -a /etc/hosts
          echo "127.0.0.1 root.kcp.localhost" | sudo tee -a /etc/hosts
      - name: E2E tests
        run: task test-e2e-${COMPONENT}
        env:
          COMPONENT: ${{ matrix.component }}

  # The image must build, but is not pushed anywhere.
  image:
    needs: [changes, verify, test]
    if: needs.changes.outputs.imageComponents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.changes.outputs.imageComponents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        env:
          COMPONENT: ${{ matrix.component }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          task images-${COMPONENT} \
            VERSION=pr-${PR:-0} \
            REPO=${GITHUB_REPOSITORY_OWNER}/platform-mesh \
            PLATFORMS=linux/amd64 \
            PUSH=false

  # ──────────────────────────────────────────────
  # Charts.
  # ──────────────────────────────────────────────
  chart-lint:
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce common image schema (air-gap localization)
        run: |
          bash hack/charts/lint-image-schema.test.sh
          ./hack/charts/lint-image-schema.sh

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/helm
        id: helm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: 'v3.14.0'
          yamllint_version: '1.37.0'
          yamale_version: '5.2.1'

      - name: Log in to ghcr.io (chart dependencies)
        run: echo "${GITHUB_TOKEN}" | ${HELM} registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM: ${{ steps.helm.outputs.path }}

      - name: Lint charts
        run: task charts:lint
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}

  chart-unittest:
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.changes.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/helm
        id: helm

      - name: Install helm-unittest
        # Helm 4 verifies plugin signatures by default; helm-unittest ships none.
        run: ${HELM} plugin install https://github.com/helm-unittest/helm-unittest --verify=false
        env:
          HELM: ${{ steps.helm.outputs.path }}

      - name: Log in to ghcr.io (chart dependencies)
        run: echo "${GITHUB_TOKEN}" | ${HELM} registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM: ${{ steps.helm.outputs.path }}

      - name: Chart unit tests
        run: |
          hack/charts/resolve-dependencies.sh
          ${HELM} unittest "charts/${CHART}"
        env:
          CHART: ${{ matrix.chart }}
          HELM: ${{ steps.helm.outputs.path }}

  # The keycloak-operator chart vendors the operator's CRDs; they must match
  # the operator version in values.yaml.
  chart-keycloak-crds:
    needs: changes
    if: contains(fromJson(needs.changes.outputs.charts), 'keycloak-operator')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Keycloak CRDs match the operator version
        run: |
          set -e
          bash hack/charts/update-keycloak-crds.sh "$(yq '.image.tag' charts/keycloak-operator/values.yaml)"
          git diff --exit-code charts/keycloak-operator/crds/

  chart-docs:
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true # zizmor: ignore[cache-poisoning]

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate chart docs
        run: task charts:docs

      - name: Generated chart docs must be committed
        run: git diff --exit-code
