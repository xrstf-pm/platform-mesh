version: "3"

# Helm chart tasks. Included from the root Taskfile as `charts`, so run e.g.
# `task charts:lint`. All paths are relative to the repository root.

includes:
  # Pinned tooling (helm, ct, helm-docs), installed into the root bin/.
  tools:
    taskfile: ../tools/Taskfile.yaml
    dir: ..

vars:
  LOCAL_BIN: bin
  # Pinned tools from tools/Taskfile.yaml (installed by the tools:* deps).
  HELM: '{{.LOCAL_BIN}}/helm'
  CT: '{{.LOCAL_BIN}}/ct'
  HELM_DOCS: '{{.LOCAL_BIN}}/helm-docs'
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: v1.2.1

env:
  # ct and helm plugins call `helm` by name.
  PATH: '{{.ROOT_DIR}}/bin:{{env "PATH"}}'
  CHARTS:
    sh: "printf '%s' $(ls -d charts/*/ | paste -sd ',' -)"
  CHANGED_CHARTS:
    sh: "( git diff --name-only main..@ 2>/dev/null ; git diff --name-only ) | grep '^charts/' | cut -d/ -f1-2 | sort | uniq | paste -sd ',' - || true"

tasks:
  setup:kube-lint:
    internal: true
    cmds:
      - mkdir -p $(pwd)/{{.LOCAL_BIN}}
      - test -s {{.LOCAL_BIN}}/kube-linter || GOBIN=$(pwd)/{{.LOCAL_BIN}} go install golang.stackrox.io/kube-linter/cmd/kube-linter@latest
      - chmod +x $(pwd)/{{.LOCAL_BIN}}/kube-linter
  setup:helm:
    internal: true
    cmds:
      - task: tools:helm
  setup:helm-unittest:
    internal: true
    deps: [setup:helm]
    cmds:
      - "{{.HELM}} plugin list | grep -q '^unittest' || {{.HELM}} plugin install https://github.com/helm-unittest/helm-unittest --version {{.HELM_UNITTEST_VERSION}} --verify=false"

  # ct lint also checks that every changed chart (vs. TARGET_BRANCH) bumped its
  # version, which is what keeps published chart versions immutable. ct needs
  # yamllint and yamale on PATH (pip install yamllint yamale).
  lint:
    deps: [setup:helm, tools:ct]
    vars:
      TARGET_BRANCH: '{{.TARGET_BRANCH | default "main"}}'
    cmds:
      - "./hack/charts/lint-image-schema.sh"
      - "{{.CT}} lint --config charts/.ct/ct.yaml --target-branch {{.TARGET_BRANCH}}"
  helmtest:
    deps: [setup:helm-unittest]
    cmds:
      - "for chart in $(echo {{.CHARTS}} | tr ',' ' '); do {{.HELM}} unittest $chart; done"
  helmtest-update:
    deps: [setup:helm-unittest]
    cmds:
      - "for chart in $(echo {{.CHARTS}} | tr ',' ' '); do {{.HELM}} unittest -u $chart; done"
  test:
    deps:
      - task: helmtest
  update-changed:
    deps:
      - task: docs
    cmds:
      - "for chart in $(echo {{.CHANGED_CHARTS}} | tr ',' ' '); do {{.HELM}} dependency update $chart && {{.HELM}} unittest -u $chart; done"
  update:
    deps:
      - task: docs
      - task: setup:helm
    cmds:
      - "for chart in $(echo {{.CHARTS}} | tr ',' ' '); do {{.HELM}} dependency update $chart; done"
  validate:
    cmds:
      - task: test
      - task: docs
      - task: update
      - task: lint
      - task: oci
  vulnerability:
    deps:
      - task: setup:kube-lint
    cmds:
      - "{{.LOCAL_BIN}}/kube-linter lint \"charts/\" --format \"plain\""
  docs:
    deps: [tools:helm-docs]
    cmds:
      - "for chart in $(echo {{.CHARTS}} | tr ',' ' '); do {{.HELM_DOCS}} --log-level=debug --chart-search-root $chart --template-files=../.docs-templates/header.md.gotmpl,README.md.gotmpl,../.docs-templates/footer.md.gotmpl --skip-version-footer=false; done"
  oci:
    desc: Package all charts into oci/
    cmds:
      - "rm -rf oci && mkdir -p oci"
      - "for chart in $(echo {{.CHARTS}} | tr ',' ' '); do helm package $chart --dependency-update --destination oci/; done"
