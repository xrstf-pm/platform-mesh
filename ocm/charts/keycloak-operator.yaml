# OCM settings for charts/keycloak-operator. See ocm/charts/README.md.

# Third-party images deployed by this chart. Published as the OCM component
# github.com/platform-mesh/images/keycloak-operator:<chart version> so that air-gapped
# installations can mirror them. Keep in sync with the chart's values.
images:
  - name: keycloak-image
    type: ociImage
    version: "v26.7.2"
    access:
      type: ociArtifact
      imageReference: "ghcr.io/platform-mesh/custom-images/keycloak:v26.7.2@sha256:5feb71bdf548ee2f7ff33ba2eba082a94de5c16d1a50de8bca71ab78a89c986b"
  - name: manager-image
    type: ociImage
    version: "26.7.2"
    access:
      type: ociArtifact
      imageReference: "quay.io/keycloak/keycloak-operator:26.7.2"
